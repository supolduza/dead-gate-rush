<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dead Gate Rush 3D</title>
<meta name="description" content="Dead Gate Rush - pick the right math gates, grow your squad and blast through zombie hordes.">
<link rel="stylesheet" href="style.css">
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" async></script>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <canvas id="fx"></canvas>
  <div id="hud" class="hidden">
    <div class="pill">LV <b id="hLevel">1</b></div>
    <div class="bar"><div id="hProg"></div></div>
    <div class="pill">🪙 <b id="hCoins">0</b></div>
    <button id="pauseBtn" class="icon">⏸</button>
    <button id="muteBtn" class="icon">🔊</button>
  </div>
  <div id="startScreen" class="overlay">
    <img src="assets/logo.png" class="logo" alt="Dead Gate Rush" onerror="this.outerHTML='<h1>DEAD GATE RUSH</h1>'">
    <p>Drag to steer. Pick the <span class="blue">blue gates</span>, dodge the <span class="red">red</span>.<br>Shoot barrels for weapons &amp; allies. Kill the boss!</p>
    <p class="small">Best level: <b id="bestLv">1</b> · Coins: <b id="sCoins">0</b></p>
    <button id="playBtn" class="big">PLAY</button>
    <button id="shopBtn" class="mid">UPGRADES</button>
  </div>
  <div id="shopScreen" class="overlay hidden">
    <h2>UPGRADES</h2>
    <p>🪙 <b id="shopCoins">0</b></p>
    <div id="shopList"></div>
    <button id="shopBack" class="mid">BACK</button>
  </div>
  <div id="pauseScreen" class="overlay hidden">
    <h2>PAUSED</h2>
    <button id="resumeBtn" class="big">RESUME</button>
    <button id="quitBtn" class="mid">MAIN MENU</button>
  </div>
  <div id="overScreen" class="overlay hidden">
    <h2 class="red">SQUAD WIPED OUT</h2>
    <p>Level <b id="oLevel">1</b> · Coins earned <b id="oCoins">0</b></p>
    <button id="reviveBtn" class="mid ad">▶ REVIVE (AD)</button>
    <button id="reviveCoinBtn" class="mid">REVIVE (🪙 50)</button>
    <button id="restartBtn" class="mid">RESTART</button>
    <button id="menuBtn2" class="mid">MAIN MENU</button>
  </div>
  <div id="winScreen" class="overlay hidden">
    <h2 class="green">LEVEL COMPLETE!</h2>
    <p class="coinsBig">🪙 +<b id="wCoins">0</b></p>
    <button id="doubleBtn" class="mid ad">▶ DOUBLE COINS (AD)</button>
    <button id="nextBtn" class="big">NEXT LEVEL</button>
    <button id="shopBtn2" class="mid">UPGRADES</button>
  </div>
</div>
<div id="adNote" class="hidden"></div>
<script type="module" src="game.js"></script>
</body>
</html>
